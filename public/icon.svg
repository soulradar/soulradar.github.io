<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14040C" />
      <stop offset="50%" stop-color="#420722" />
      <stop offset="100%" stop-color="#7C0E44" />
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D49A9A" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#AA5E7A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7C0E44" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#D49A9A" stroke-width="4" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#D49A9A" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#F2DACE" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Crosshairs -->
  <line x1="56" y1="256" x2="456" y2="256" stroke="#D49A9A" stroke-width="3" stroke-dasharray="10 10" stroke-opacity="0.35"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#D49A9A" stroke-width="3" stroke-dasharray="10 10" stroke-opacity="0.35"/>

  <!-- Radar Sweep Slice -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#pulseGrad)" />
  
  <!-- Central Glowing Heart Compass -->
  <circle cx="256" cy="256" r="54" fill="#7C0E44" stroke="#F2DACE" stroke-width="6"/>
  
  <!-- Heart Icon -->
  <path d="M256 280 C256 280 230 262 218 248 C204 232 208 212 226 206 C240 201 251 211 256 218 C261 211 272 201 286 206 C304 212 308 232 294 248 C282 262 256 280 256 280 Z" fill="#F2DACE"/>
  
  <!-- Destination Star Pip -->
  <circle cx="340" cy="172" r="10" fill="#FFFDFB"/>
  <circle cx="340" cy="172" r="20" fill="none" stroke="#F2DACE" stroke-width="3" stroke-opacity="0.8"/>
</svg>
